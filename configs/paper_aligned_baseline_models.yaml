feature_config: configs/paper_aligned_features.yaml
results_json: results/baseline/paper_aligned/individual_baseline_results.json
results_csv: results/baseline/paper_aligned/individual_baseline_results.csv
artifact_dir: results/artifacts/paper_aligned/baseline_models
seed: 42
selection_split: validation
final_test_usage: reporting_only
append_creator_to_static_views: true
feature_views:
  - opcode_term_count
  - opcode_tfidf
  - opcode_ngram_count_1_3_df_filtered
  - opcode_ngram_tfidf_1_3_df_filtered
  - opcode_word2vec_idf_weighted
  - opcode_word2vec_mean
feature_artifacts:
  opcode_term_count: opcode_term_count.joblib
  opcode_tfidf: opcode_tfidf.joblib
  opcode_ngram_count_1_3_df_filtered: opcode_ngram_count_1_3_df_filtered.joblib
  opcode_ngram_tfidf_1_3_df_filtered: opcode_ngram_tfidf_1_3_df_filtered.joblib
  opcode_word2vec_idf_weighted: opcode_word2vec_idf_weighted.joblib
  opcode_word2vec_mean: opcode_word2vec_mean.joblib
models:
  ridge:
    alpha: 1.0
    class_weight: null
  svm:
    C: 1.0
    kernel: linear
    class_weight: null
    tol: 0.001
    cache_size: 1024
  xgboost:
    objective: binary:logistic
    eval_metric: logloss
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 3
    min_child_weight: 1
    subsample: 1.0
    colsample_bytree: 1.0
    reg_lambda: 1.0
    tree_method: hist
    n_jobs: 1
