phase: 6A
experiment_name: controlled_cost_sensitive_learning
hypothesis: >-
  H6A: Cost-sensitive learning improves Ponzi-class recall and F1 relative to
  the frozen Phase 5.5 baseline without an excessive loss of precision.
seed: 42
dataset: data/raw/PonziDataset_20221114.csv
split_membership: results/baseline/paper_aligned/split_membership.csv
paper_feature_config: configs/paper_aligned_features.yaml
paper_model_config: configs/paper_aligned_baseline_models.yaml
frozen_manifest: configs/experiments/phase6a/frozen_phase55_manifest.yaml
output_dir: results/experiments/phase6a
selection:
  cv_primary_metric: f1
  minimum_cv_precision: 0.80
  cv_tie_breakers: [recall, pr_auc, precision]
  validation_primary_metric: f1
  minimum_validation_precision: 0.80
  validation_tie_breakers: [recall, pr_auc, precision]
  final_test_usage: prohibited
temporal_cv:
  train_positive_ends: [50, 100, 150]
  validation_positive_ends: [100, 150, 200]
features:
  ridge: opcode_term_count
  svm: opcode_ngram_tfidf_1_3_df_filtered
  xgboost: opcode_ngram_tfidf_1_3_df_filtered
cost_candidates:
  ridge:
    - {name: none, class_weight: null}
    - {name: balanced, class_weight: balanced}
    - {name: positive_5, positive_weight: 5.0}
    - {name: positive_10, positive_weight: 10.0}
    - {name: positive_28_195, positive_weight: 28.195}
  svm:
    - {name: none, class_weight: null}
    - {name: balanced, class_weight: balanced}
    - {name: positive_5, positive_weight: 5.0}
    - {name: positive_10, positive_weight: 10.0}
    - {name: positive_28_195, positive_weight: 28.195}
  xgboost:
    - {name: scale_1, scale_pos_weight: 1.0}
    - {name: scale_5, scale_pos_weight: 5.0}
    - {name: scale_10, scale_pos_weight: 10.0}
    - {name: scale_20, scale_pos_weight: 20.0}
    - {name: scale_28_195, scale_pos_weight: 28.195}
    - {name: scale_35, scale_pos_weight: 35.0}
reference_validation:
  label: frozen_phase_5_5_mulcas_validation
  precision: 0.7931034482758621
  recall: 0.92
  f1: 0.8518518518518519
  pr_auc: 0.870639987619326
