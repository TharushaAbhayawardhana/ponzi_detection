phase: 6C
experiment_name: controlled_decision_threshold_optimization
hypothesis: >-
  H6C: Optimizing the classifier operating threshold using forward-only
  temporal cross-validation improves Ponzi-class F1 and/or recall relative
  to the frozen Phase 5.5 operating point while maintaining useful precision.
seed: 42
dataset: data/raw/PonziDataset_20221114.csv
split_membership: results/baseline/paper_aligned/split_membership.csv
paper_feature_config: configs/paper_aligned_features.yaml
paper_model_config: configs/paper_aligned_baseline_models.yaml
paper_mulcas_config: configs/paper_aligned_mulcas.yaml
frozen_phase55_manifest: configs/experiments/phase6a/frozen_phase55_manifest.yaml
frozen_phase6a_manifest: configs/experiments/phase6b/frozen_phase6a_manifest.yaml
frozen_phase6b_manifest: configs/experiments/phase6c/frozen_phase6b_manifest.yaml
output_dir: results/experiments/phase6c
selection:
  minimum_cv_precision: 0.80
  primary_metric: f1
  tie_breakers: [recall, balanced_accuracy, closest_to_default]
  quantile_grid_size: 101
  final_test_usage: prohibited
temporal_cv:
  train_positive_ends: [50, 100, 150]
  validation_positive_ends: [100, 150, 200]
models:
  ridge:
    feature: opcode_term_count
    score_type: decision_function
    default_threshold: 0.0
  svm:
    feature: opcode_ngram_tfidf_1_3_df_filtered
    score_type: decision_function
    default_threshold: 0.0
  xgboost:
    feature: opcode_ngram_tfidf_1_3_df_filtered
    score_type: probability
    default_threshold: 0.5
reference_validation:
  label: frozen_phase_5_5_mulcas_validation
  precision: 0.7931034482758621
  recall: 0.92
  f1: 0.8518518518518519
  pr_auc: 0.870639987619326
  balanced_accuracy: 0.9
