phase: 6D2
experiment_name: controlled_normalized_operand_features
hypothesis: >-
  H6D2: Normalized operand-derived static features capture useful information
  discarded by opcode-only preprocessing and improve Ponzi detection.
seed: 42
dataset: data/raw/PonziDataset_20221114.csv
split_membership: results/baseline/paper_aligned/split_membership.csv
operand_source: contractCode
metadata_policy: preserve_full_deployed_runtime_bytecode_matching_existing_opcode_reproduction
small_constant_max_inclusive: 255
paper_feature_config: configs/paper_aligned_features.yaml
paper_model_config: configs/paper_aligned_baseline_models.yaml
paper_mulcas_config: configs/paper_aligned_mulcas.yaml
frozen_phase55_manifest: configs/experiments/phase6a/frozen_phase55_manifest.yaml
frozen_phase6a_manifest: configs/experiments/phase6b/frozen_phase6a_manifest.yaml
frozen_phase6b_manifest: configs/experiments/phase6c/frozen_phase6b_manifest.yaml
frozen_phase6c_manifest: configs/experiments/phase6d1/frozen_phase6c_manifest.yaml
frozen_phase6d1_manifest: configs/experiments/phase6d2/frozen_phase6d1_manifest.yaml
output_dir: results/experiments/phase6d2
selection: {minimum_cv_precision: 0.80, final_test_usage: prohibited}
temporal_cv:
  train_positive_ends: [50, 100, 150]
  validation_positive_ends: [100, 150, 200]
baseline_features:
  ridge: opcode_term_count
  svm: opcode_ngram_tfidf_1_3_df_filtered
  xgboost: opcode_ngram_tfidf_1_3_df_filtered
representations:
  - {id: operand_only, baseline: false, groups: [A, B, C, D]}
  - {id: frozen_baseline, baseline: true, groups: []}
  - {id: baseline_plus_all_operands, baseline: true, groups: [A, B, C, D]}
  - {id: baseline_plus_group_a, baseline: true, groups: [A]}
  - {id: baseline_plus_group_b, baseline: true, groups: [B]}
  - {id: baseline_plus_group_c, baseline: true, groups: [C]}
  - {id: baseline_plus_group_d, baseline: true, groups: [D]}
reference_validation:
  {precision: 0.7931034482758621, recall: 0.92, f1: 0.8518518518518519,
   pr_auc: 0.870639987619326, balanced_accuracy: 0.9, tn: 88, fp: 12, fn: 4, tp: 46}
